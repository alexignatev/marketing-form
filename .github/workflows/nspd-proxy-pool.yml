name: NSPD proxy-pool probe

on:
  push:
    branches: ["main"]
    paths:
      - "tools/nspd_proxy_pool.py"
      - ".github/workflows/nspd-proxy-pool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests pysocks
      - run: python tools/nspd_proxy_pool.py 2>&1 | tee nspd_proxy_result/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nspd-proxy-result
          path: nspd_proxy_result
          retention-days: 7

